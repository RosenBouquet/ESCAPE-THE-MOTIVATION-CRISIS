<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room – Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;padding:12px}
.wrap{max-width:620px;margin:0 auto}
h1{color:#58a6ff;font-size:1.3rem;text-align:center;margin-bottom:4px}
.sub{color:#8b949e;text-align:center;font-size:.85rem;margin-bottom:16px}
.gsel{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px}
.gbtn{padding:10px 12px;border-radius:8px;border:2px solid #30363d;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:.85rem;font-weight:600;line-height:1.3;text-align:center;flex:1;min-width:100px}
.gbtn:hover,.gbtn.sel{border-color:#58a6ff;background:#1f4068;color:#58a6ff}
.panel{display:none}.panel.active{display:block}
.intro{background:#1a2733;border-left:3px solid #58a6ff;padding:10px 14px;border-radius:4px;margin-bottom:14px;font-size:.85rem;color:#c9d1d9;line-height:1.5}
.q{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:10px}
.q .stem{font-size:.88rem;font-weight:600;color:#c9d1d9;margin-bottom:8px;line-height:1.4}
.opts label{display:block;padding:6px 10px;margin:2px 0;border-radius:5px;cursor:pointer;font-size:.83rem;transition:background .15s;border:1px solid transparent}
.opts label:hover{background:#1a2733}
.opts input{margin-right:8px}
.q.ok{border-color:#238636;background:#0d2818}.q.bad{border-color:#f85149;background:#2d1215}
.q.ok .stem::after{content:" ✅"}.q.bad .stem::after{content:" ❌"}
.submit{display:block;width:100%;padding:12px;border-radius:8px;border:none;background:#238636;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin:14px 0}
.submit:hover{background:#2ea043}
.result{text-align:center;padding:20px;border-radius:10px;margin-top:14px;display:none}
.result.win{display:block;background:#0d2818;border:2px solid #238636}
.result h2{color:#3fb950;font-size:1.2rem}
.result .code{font-size:2.5rem;font-weight:700;color:#fff;letter-spacing:6px;margin:10px 0}
.result .hint{color:#c9d1d9;font-size:.85rem;line-height:1.5;margin-top:10px}
.result.fail{display:block;background:#2d1215;border:2px solid #f85149}
.result.fail h2{color:#f85149}
.score{color:#8b949e;text-align:center;font-size:.85rem;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>     
    <img src="lock.png" alt="Icon" height="30" style="margin-right: 2px;">
    Escape the Motivation Crisis</h1>
<p class="sub">Station: Gedankenblasen – Lauras psychische Systeme</p>

<div class="panel active" id="panel"></div>
</div>

<script>
const DATA = {
    name: "Gedankenblasen",
    task: "Psychische Systeme",
    code: "DU",
    intro: "Analysiert Lauras Gedanken mithilfe der PSI-Theorie. Welches System oder welcher Modus ist aktiv? Beantwortet alle Fragen richtig für euer Codewort.",
    qs: [
        {s:"1) Laura sitzt am Sonntagabend am Schreibtisch und erstellt eine Liste mit Forschungsinstituten. Sie ist gestresst und plant analytisch. Welches System hemmt hier die spontane Ausführung?", o:["Objekterkennung","Intuitive Verhaltenssteuerung","Absichtsgedächtnis","Extensionsgedächtnis"], a:2},
        {s:"2) Laura führt mit einem Schüler ein diagnostisches Spiel durch. Sie vergisst die Zeit und reagiert spontan und passend. Was passiert hier?", o:["Zugang zum ganzheitlichen Selbst","Energetisierung von Verhaltensroutinen durch hohen positiven Affekt","Analytische Planung","Fokus auf Fehler"], a:1},
        {s:"3) Laura liest eine Stellenausschreibung und starrt verunsichert auf die Anforderung 'R-Kenntnisse'. Welches System ist bei diesem Fokus auf Details und Fehler (negativer Affekt) aktiv?", o:["Absichtsgedächtnis","Extensionsgedächtnis","Intuitive Verhaltenssteuerung","Objekterkennung"], a:3},
        {s:"4) Laura macht einen Waldspaziergang und fühlt nach dem Nachdenken eine tiefe Gewissheit und innere Ruhe. Welches System ist hier aktiv?", o:["Extensionsgedächtnis (Zugang zum integrierten Selbst)","Absichtsgedächtnis","Objekterkennung","Intuitive Verhaltenssteuerung"], a:0},
        {s:"5) Laura setzt sich ohne Plan an ihr Notizbuch und verknüpft begeistert eigene Beobachtungen mit Forschungsfragen. Welcher Modus (Extensionsgedächtnis + Intuitive Verhaltenssteuerung) ist das?", o:["Selbstkontrolle","Lageorientierung","Selbstmanagement (Self-Maintenance)","Selbstinfiltration"], a:2},
        {s:"6) Lauras Eltern zählen Vorteile ihres Jobs auf. Laura nickt, obwohl sie sich innerlich unwohl und fremdbestimmt fühlt. Welcher Modus (Absichtsgedächtnis + Objekterkennung) ist das?", o:["Selbstmanagement","Selbstkontrolle","Persönliches Wachstum","Volitionale Effizienz"], a:1},
        {s:"7) Laut Koole et al. (2018): Welcher Affektwechsel ist laut PSI-Theorie entscheidend für 'Volitionale Effizienz' (Absichten in Taten umsetzen)?", o:["Dämpfung von negativem Affekt","Wiederherstellung von positivem Affekt","Vermeidung von Fehlern","Steigerung von negativem Affekt"], a:1},
        {s:"8) Was ist laut dem Paper ein Kernvorteil von handlungsorientierten Personen gegenüber lageorientierten Personen unter Stress?", o:["Sie haben bessere kognitive Pläne","Sie verfügen über effizientere Affektregulation","Sie vermeiden schwierige Situationen","Sie brauchen mehr externes Feedback"], a:1}
    ]
};

function renderQuiz() {
    const panel = document.getElementById('panel');
    let html = `<div class="intro"><strong>${DATA.name}</strong><br>${DATA.intro}</div>`;
    
    DATA.qs.forEach((q, i) => {
        html += `<div class="q" id="q${i}"><div class="stem">${q.s}</div><div class="opts">`;
        q.o.forEach((o, j) => {
            html += `<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`;
        });
        html += `</div></div>`;
    });
    
    html += `<button class="submit" onclick="check()">✓ Prüfen</button><div class="score" id="score"></div><div class="result" id="result"></div>`;
    panel.innerHTML = html;
}

function check() {
    let ok = 0;
    DATA.qs.forEach((q, i) => {
        const el = document.getElementById('q'+i);
        const s = document.querySelector(`input[name="q${i}"]:checked`);
        el.classList.remove('ok', 'bad');
        if (!s) { el.classList.add('bad'); return; }
        if (parseInt(s.value) === q.a) { el.classList.add('ok'); ok++; }
        else el.classList.add('bad');
    });
    
    const t = DATA.qs.length;
    document.getElementById('score').textContent = ok + '/' + t + ' richtig';
    const r = document.getElementById('result');
    
    if (ok === t) {
        r.className = 'result win';
        r.innerHTML = `<h2>🎉 Alle richtig!</h2><div class="code">${DATA.code}</div><p class="hint">Notiert euch das Codewort auf eurem Zettel!</p>`;
    } else {
        r.className = 'result fail';
        r.innerHTML = `<h2>Noch nicht komplett</h2><p style="color:#c9d1d9">${ok}/${t} richtig. Korrigiert die roten Fragen.</p>`;
    }
    r.scrollIntoView({behavior: 'smooth', block: 'center'});
}

window.onload = renderQuiz;
</script>
</body>
</html>
